<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="256" y1="88" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="200" y1="210" x2="312" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Fondo oscuro táctico -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="100" stroke="#1E293B" stroke-width="4" />

  <!-- Aura geométrica sutil azul -->
  <polygon points="256,64 410,160 370,410 256,456 142,410 102,160" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="3" />

  <!-- Silueta del búho geométrico -->
  <!-- Orejas / Penachos -->
  <polygon points="122,126 196,158 150,214" fill="#334155" />
  <polygon points="390,126 316,158 362,214" fill="#334155" />
  <polygon points="122,126 170,148 150,180" fill="#38BDF8" fill-opacity="0.35" />
  <polygon points="390,126 342,148 362,180" fill="#38BDF8" fill-opacity="0.35" />

  <!-- Cabeza y cuerpo facetado -->
  <polygon points="196,158 256,136 316,158 362,214 342,356 256,422 170,356 150,214" fill="url(#wingGrad)" stroke="#475569" stroke-width="3" stroke-linejoin="round" />

  <!-- Facetas internas del pecho -->
  <polygon points="256,280 342,356 256,422 170,356" fill="#0F172A" fill-opacity="0.55" />
  <polygon points="256,280 296,348 256,396 216,348" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2" />

  <!-- Frente en V táctica -->
  <polygon points="196,158 256,136 316,158 256,232" fill="#1E293B" />
  <polyline points="150,214 256,246 362,214" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Discos faciales -->
  <polygon points="164,218 238,244 224,296 172,276" fill="#0B0F17" stroke="#334155" stroke-width="2.5" />
  <polygon points="348,218 274,244 288,296 340,276" fill="#0B0F17" stroke="#334155" stroke-width="2.5" />

  <!-- Ojos ámbar tácticos -->
  <polygon points="180,238 224,250 214,274 184,264" fill="url(#amberGrad)" />
  <polygon points="332,238 288,250 298,274 328,264" fill="url(#amberGrad)" />
  <!-- Destello azul en ojos -->
  <circle cx="204" cy="256" r="5" fill="#0B0F17" />
  <circle cx="308" cy="256" r="5" fill="#0B0F17" />
  <circle cx="199" cy="252" r="2.5" fill="#38BDF8" />
  <circle cx="303" cy="252" r="2.5" fill="#38BDF8" />

  <!-- Pico -->
  <polygon points="244,254 268,254 256,294" fill="#F59E0B" />
  <polygon points="256,254 268,254 256,294" fill="#D97706" />

  <!-- Acento inferior -->
  <polyline points="222,386 256,412 290,386" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
