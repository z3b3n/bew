name: Build BEW Releases (iOS IPA, Android APK & Garmin PRG)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build BEW-iOS.ipa (unsigned)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Resolve App Version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION="1.3.4"
          fi
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build BEW iOS (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package BEW-iOS.ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/*.app build/ipa/Payload/
          (cd build/ipa && zip -r -y ../../BEW-iOS.ipa Payload)
          ls -lh BEW-iOS.ipa

      - name: Upload BEW-iOS.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEW-iOS
          path: BEW-iOS.ipa
          if-no-files-found: error

  build-android:
    name: Build BEW-Android.apk (signed)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign and align BEW-Android.apk
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BUILD_TOOLS"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/bew-release.jks" \
            -alias bew \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bewpass123 -keypass bewpass123 \
            -dname "CN=BEW, OU=Mobile, O=ZETO, L=ES, C=ES"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/bew-release.jks" \
            --ks-key-alias bew \
            --ks-pass pass:bewpass123 \
            --key-pass pass:bewpass123 \
            --out BEW-Android.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose BEW-Android.apk
          ls -lh BEW-Android.apk

      - name: Upload BEW-Android.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEW-Android
          path: BEW-Android.apk
          if-no-files-found: error

  build-garmin:
    name: Build BEW-Fenix6XPro.prg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate temporary Garmin developer key
        run: |
          openssl genrsa -out ./developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in ./developer_key.pem -out ./developer_key.der -nocrypt

      - name: Build Garmin Widget for Fenix 6X Pro
        uses: blackshadev/garmin-connectiq-build-action@9.2.0
        with:
          projectJungle: ./garmin/monkey.jungle
          developerKey: ./developer_key.der
          outputPath: BEW-Fenix6XPro.prg
          device: fenix6xpro
          typeCheck: '0'

      - name: Verify PRG output & clean key
        run: |
          rm -f ./developer_key.pem ./developer_key.der
          ls -lh BEW-Fenix6XPro.prg

      - name: Upload BEW-Fenix6XPro.prg artifact
        uses: actions/upload-artifact@v4
        with:
          name: BEW-Fenix6XPro
          path: BEW-Fenix6XPro.prg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-ios, build-android, build-garmin]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: List assets
        run: ls -lh BEW-iOS.ipa BEW-Android.apk BEW-Fenix6XPro.prg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BEW ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## BEW ${{ github.ref_name }} — Cuadrante de Turnos Offline

            ### Descargas
            - **`BEW-iOS.ipa`** — iPhone 16 Pro (sin firmar, instalable mediante AltStore, SideStore o Sideloadly).
            - **`BEW-Android.apk`** — Android firmado, listo para instalar directamente.
            - **`BEW-Fenix6XPro.prg`** — Widget nativo para **Garmin Fenix 6X Pro** (copiar por USB en `GARMIN/APPS/`).

            ### Novedades v1.3.0
            - **Estudio previo de imagen:** recorte táctil, rotación ±90°, mejora de contraste para documentos y soporte multipágina para cuadrantes partidos en varias fotos.
            - **Cámara nativa y portapapeles:** captura directa con `@capacitor/camera` en iOS/Android, arrastrar y soltar o pegar imagen (`Ctrl+V`).
            - **Motor IA anclado por calendario:** guía exacta de días del mes para evitar desplazamientos de columna, modo `Todo el equipo` o `Solo ZETO` y aviso si la foto corresponde a otro mes.
            - **Revisión visual editable:** cuadrícula interactiva antes de guardar (toca cualquier celda para corregir el OCR) y mapeo de alias de compañeros.
            - **UI/UX mejorada:** modo **Pintar turnos** rápido, gestos swipe entre meses, progreso en vivo del turno actual + próximo servicio, y columna **ZETO** fija real en la matriz del equipo.
          files: |
            BEW-iOS.ipa
            BEW-Android.apk
            BEW-Fenix6XPro.prg
